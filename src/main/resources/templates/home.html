<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Catálogo')}"></head>
<body>
    <header th:replace="~{base :: header}"></header>
    <main>
        <p class="legenda">Biblioteca comunitária</p>
        <h1>Catálogo</h1>
        <p>Encontre sua próxima leitura no acervo.</p>
        <form class="filtros" th:action="@{/home}" method="get">
            <div class="campo">
                <label for="busca">Título, autor ou ISBN</label>
                <input id="busca" name="busca" type="search" th:value="${busca}" placeholder="O que você quer ler?">
            </div>
            <div class="campo">
                <label for="categoriaId">Categoria</label>
                <select id="categoriaId" name="categoriaId">
                    <option value="">Todas as categorias</option>
                    <option th:each="categoria : ${categorias}" th:value="${categoria.id}" th:text="${categoria.nome}" th:selected="${categoria.id == categoriaId}"></option>
                </select>
            </div>
            <label class="checkbox"><input type="checkbox" name="disponiveis" value="true" th:checked="${disponiveis}"> Só disponíveis</label>
            <button type="submit">Buscar</button>
            <a th:href="@{/home}">Limpar filtros</a>
        </form>
        <p class="card" th:if="${#lists.isEmpty(livros)}">Nenhum livro encontrado para esses filtros.</p>
        <div class="catalogo">
            <article class="card livro-card" th:each="livro : ${livros}">
                <p class="legenda"><strong>Categoria:</strong> <span th:text="${livro.categoria.nome}"></span></p>
                <h2 th:text="${livro.titulo}"></h2>
                <p>
                    <strong>Autor:</strong>
                    <span th:if="${#sets.isEmpty(livro.autores)}">Não informado</span>
                    <span th:each="autor, posicao : ${livro.autores}" th:text="${autor.nome} + ${posicao.last ? '' : ', '}"></span>
                </p>
                <p><strong>Ano:</strong> <span th:text="${livro.anoPublicacao != null ? livro.anoPublicacao : 'Não informado'}"></span></p>
                <p class="disponibilidade" th:classappend="${livro.qtdDisponiveis() == 0 ? 'sem-estoque' : ''}">
                    <strong>Disponibilidade:</strong>
                    <span th:text="${livro.qtdDisponiveis() > 0 ? livro.qtdDisponiveis() + ' de ' + #lists.size(livro.exemplares) + ' disponíveis' : 'Indisponível'}"></span>
                </p>
                <a class="botao" th:href="@{/livro/{id}(id=${livro.id})}" th:aria-label="'Ver ' + ${livro.titulo}">Ver</a>
            </article>
        </div>
    </main>
</body>
</html>
