<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Início')}"></head>
<body>
	<header th:replace="~{base :: header}"></header>
	<main>
		<p class="legenda">Biblioteca comunitária</p>
		<h1>Bem-vindo ao BiblioTech</h1>
		<p>Organize os autores e as categorias do acervo.</p>
		<div class="cards">
			<section class="card">
				<h2>Autores</h2>
				<p>Consulte e cadastre os autores dos livros.</p>
				<a class="botao" th:href="@{/autor}">Ver autores</a>
			</section>
			<section class="card">
				<h2>Categorias</h2>
				<p>Organize os livros por assunto ou gênero.</p>
				<a class="botao" th:href="@{/categoria}">Ver categorias</a>
			</section>
		</div>
	</main>
	<section th:replace="~{autor/lista :: lista}"></section>
	<section th:replace="~{categoria/lista :: lista}"></section>
</body>
</html>
