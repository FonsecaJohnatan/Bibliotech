<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | BiblioTech'">BiblioTech</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <script defer th:src="@{/js/telas.js}"></script>
</head>
<body>
    <header th:fragment="header" class="cabecalho" th:classappend="${autenticado} ? 'com-menu'">
        <div class="barra-superior">
            <button th:if="${autenticado}" id="alternar-menu" class="alternar-menu" type="button"
                    aria-controls="menu-lateral" aria-expanded="true" aria-label="Recolher menu" title="Recolher menu">
                <span aria-hidden="true">☰</span>
            </button>
            <a class="marca" th:href="@{/home}">BiblioTech</a>
            <a th:unless="${autenticado}" th:href="@{/login}">Entrar</a>
            <div class="conta-menu" th:if="${autenticado}">
                <span class="nome-usuario" th:text="${nomeUsuario}"></span>
                <form class="sair" th:action="@{/sair}" method="post">
                    <button type="submit">Sair</button>
                </form>
            </div>
        </div>
        <nav th:if="${autenticado}" id="menu-lateral" class="menu-lateral" aria-label="Menu principal">
            <p class="titulo-menu">Navegação</p>
            <div class="links-menu">
                <a th:href="@{/home}" title="Catálogo" aria-label="Catálogo">
                    <svg class="icone-menu" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 6c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Z"/><path d="M12 6v15"/></svg>
                    <span class="texto-menu">Catálogo</span>
                </a>
                <a th:href="@{/meus-emprestimos}" title="Meus empréstimos" aria-label="Meus empréstimos">
                    <svg class="icone-menu" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h6M9 18h3"/></svg>
                    <span class="texto-menu">Meus empréstimos</span>
                </a>
                <a th:if="${podeGerenciar}" th:href="@{/emprestimo}" title="Empréstimos" aria-label="Empréstimos">
                    <svg class="icone-menu" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/></svg>
                    <span class="texto-menu">Empréstimos</span>
                </a>
                <a th:if="${podeGerenciar}" th:href="@{/livro}" title="Livros" aria-label="Livros">
                    <svg class="icone-menu" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 3h13a1 1 0 0 1 1 1v17H6a3 3 0 0 1-3-3V5a2 2 0 0 1 2-2Z"/><path d="M3 17h16M7 3v14M11 7h4"/></svg>
                    <span class="texto-menu">Livros</span>
                </a>
                <a th:if="${podeGerenciar}" th:href="@{/exemplar}" title="Exemplares" aria-label="Exemplares">
                    <svg class="icone-menu" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 3 10 5-10 5L2 8l10-5ZM2 12l10 5 10-5M2 16l10 5 10-5"/></svg>
                    <span class="texto-menu">Exemplares</span>
                </a>
                <a th:if="${podeGerenciar}" th:href="@{/autor}" title="Autores" aria-label="Autores">
                    <svg class="icone-menu" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m16 3 5 5-12 12-6 1 1-6L16 3ZM13 6l5 5M4 15l5 5"/></svg>
                    <span class="texto-menu">Autores</span>
                </a>
                <a th:if="${podeGerenciar}" th:href="@{/categoria}" title="Categorias" aria-label="Categorias">
                    <svg class="icone-menu" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 3h8l10 10-8 8L3 11V3Z"/><circle cx="7.5" cy="7.5" r="1"/></svg>
                    <span class="texto-menu">Categorias</span>
                </a>
                <a th:if="${administrador}" th:href="@{/usuario}" title="Usuários" aria-label="Usuários">
                    <svg class="icone-menu" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M17 3a4 4 0 0 1 0 8M22 21v-2a7 7 0 0 0-4-6"/></svg>
                    <span class="texto-menu">Usuários</span>
                </a>
            </div>
        </nav>
        <button th:if="${autenticado}" class="fundo-menu" type="button" tabindex="-1" aria-label="Fechar menu"></button>
    </header>
    <h1 th:fragment="titulo(valor)" th:text="${valor}">Título</h1>
</body>
</html>
