<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Cadastro de autor')}"></head>
<body>
	<header th:replace="~{base :: header}"></header>
	<main class="formulario">
		<a th:href="@{/autor}">Voltar para autores</a>
		<h1 th:text="${id != null ? 'Editar autor' : 'Novo autor'}">Cadastro</h1>
		<p>O nome é obrigatório. Os demais campos são opcionais.</p>
		<form th:object="${requisicaoNovoAutor}" th:action="${id != null} ? @{/autor/{id}(id=${id})} : @{/autor/novo}" method="post">
			<div class="erro" role="alert" th:if="${#fields.hasGlobalErrors()}">
				<p th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></p>
			</div>
			<div class="campo">
				<label for="nome">Nome</label>
				<input id="nome" type="text" th:field="*{nome}" maxlength="120" required th:errorclass="invalido" aria-describedby="nome-erro">
				<small id="nome-erro" class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>
			</div>
			<div class="campo">
				<label for="nacionalidade">Nacionalidade</label>
				<input id="nacionalidade" type="text" th:field="*{nacionalidade}" maxlength="60" th:errorclass="invalido" aria-describedby="nacionalidade-erro">
				<small id="nacionalidade-erro" class="erro-campo" th:if="${#fields.hasErrors('nacionalidade')}" th:errors="*{nacionalidade}"></small>
			</div>
			<div class="campo">
				<label for="dataNascimento">Data de nascimento</label>
				<input id="dataNascimento" type="date" th:field="*{dataNascimento}" th:errorclass="invalido" aria-describedby="dataNascimento-erro">
				<small id="dataNascimento-erro" class="erro-campo" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}"></small>
			</div>
			<div class="acoes">
				<button type="submit">Salvar</button>
				<a th:href="@{/autor}">Cancelar</a>
			</div>
		</form>
	</main>
</body>
</html>
