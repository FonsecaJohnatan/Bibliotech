<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Livros')}"></head>
<body>
	<header th:replace="~{base :: header}"></header>
	<main th:fragment="lista">
		<div class="titulo">
			<h1>Livros</h1>
			<a class="botao" th:if="${podeGerenciar}" th:href="@{/livro/formulario}">Novo livro</a>
		</div>
		<p class="card" th:if="${#lists.isEmpty(livros)}">Nenhum livro cadastrado. Use o botão acima para começar.</p>
		<div class="tabela" th:unless="${#lists.isEmpty(livros)}">
			<table>
				<caption class="sr-only">Lista de livros</caption>
				<thead>
					<tr>
						<th scope="col">Título</th>
						<th scope="col">Disponíveis</th>
                        <th scope="col">ISBN</th>
						<th scope="col">Ano</th>
						<th scope="col">Categoria</th>
						<th scope="col">Autores</th>
						<th scope="col" th:if="${podeGerenciar}">Ações</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="livro : ${livros}">
						<td><a th:href="@{/livro/{id}(id=${livro.id})}" th:text="${livro.titulo}"></a></td>
						<td th:text="${livro.qtdDisponiveis()} + '/' + ${#lists.size(livro.exemplares)}"></td>
                        <td th:text="${livro.isbn}"></td>
						<td th:text="${livro.anoPublicacao}"></td>
						<td th:text="${livro.categoria.nome}"></td>
						<td>
							<span th:if="${#sets.isEmpty(livro.autores)}">Não informado</span>
							<span th:each="autor, status : ${livro.autores}" th:text="${autor.nome} + ${status.last ? '' : ', '}"></span>
						</td>
						<td th:if="${podeGerenciar}"><a th:href="@{/livro/{id}/editar(id=${livro.id})}" th:aria-label="'Editar ' + ${livro.titulo}">Editar</a></td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>
</body>
</html>
