<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Usuários')}"></head>
<body>
	<header th:replace="~{base :: header}"></header>
	<main th:fragment="lista">
		<div class="titulo">
			<h1>Usuários</h1>
			<a class="botao" th:href="@{/usuario/formulario}">Novo usuário</a>
		</div>
		<p class="card" th:if="${#lists.isEmpty(usuarios)}">Nenhum usuário cadastrado. Use o botão acima para começar.</p>
		<div class="tabela" th:unless="${#lists.isEmpty(usuarios)}">
			<table>
				<caption class="sr-only">Lista de usuários</caption>
				<thead>
					<tr>
						<th scope="col">Nome</th>
						<th scope="col">E-mail</th>
						<th scope="col">Perfil</th>
						<th scope="col">Situação</th>
						<th scope="col">Ações</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="usuario : ${usuarios}">
						<td th:text="${usuario.nome}"></td>
						<td th:text="${usuario.email}"></td>
						<td th:text="${#messages.msg('perfil.' + usuario.perfil)}"></td>
						<td th:text="${usuario.ativo ? 'Ativo' : 'Inativo'}"></td>
						<td>
							<div class="acoes">
								<a th:href="@{/usuario/{id}/editar(id=${usuario.id})}" th:aria-label="'Editar ' + ${usuario.nome}">Editar</a>
								<form class="acao-tabela" th:if="${usuario.ativo}" th:action="@{/usuario/{id}/desativar(id=${usuario.id})}" method="post">
									<button type="submit" th:aria-label="'Desativar ' + ${usuario.nome}">Desativar</button>
								</form>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>
</body>
</html>
