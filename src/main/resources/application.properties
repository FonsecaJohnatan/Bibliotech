spring.application.name=bibliotech
server.servlet.session.tracking-modes=cookie
spring.config.import=optional:file:.env[.properties]
bibliotech.admin.email=${BIBLIOTECH_ADMIN_EMAIL:}
bibliotech.admin.senha=${BIBLIOTECH_ADMIN_SENHA:}

# Swagger: documentar somente a API REST
springdoc.paths-to-match=/service/**

# Banco H2 em memória (desenvolvimento / Etapa 1)
spring.datasource.url=jdbc:h2:mem:bibliotech;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Para usar PostgreSQL, comente as linhas do H2 acima e descomente:
# spring.datasource.url=jdbc:postgresql://localhost:5432/bibliotech
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres
